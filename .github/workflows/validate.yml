name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  manifest:
    name: manifest schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jq parses
        run: jq -e '.tools | length' manifest.json
      - name: every tool has name + category + verify (or null)
        run: |
          jq -e '
            .tools
            | map(
                (has("name") and (.name | type == "string"))
                and (has("category") and (.category | type == "string"))
                and (has("verify"))
                and (has("win") and has("linux"))
                and ((.win == null) or (.win.via | IN("scoop", "winget", "custom")))
                and ((.linux == null) or (.linux.via | IN("apt", "custom")))
                and ((.win != null) or (.linux != null))
              )
            | all
          ' manifest.json
      - name: every "via: custom" handler is referenced in BOTH scripts
        run: |
          set -e
          win_handlers=$(jq -r '.tools[] | select(.win.via=="custom") | .win.handler' manifest.json | tr -d '' | sort -u)
          lnx_handlers=$(jq -r '.tools[] | select(.linux.via=="custom") | .linux.handler' manifest.json | tr -d '' | sort -u)
          missing=0
          for h in $win_handlers; do
            grep -q "'$h'" install.ps1 || { echo "::error file=install.ps1::missing case for custom handler '$h'"; missing=1; }
          done
          for h in $lnx_handlers; do
            grep -q "^[[:space:]]*$h)" install.sh || { echo "::error file=install.sh::missing case for custom handler '$h'"; missing=1; }
          done
          exit $missing
      - name: every "linux.repo" id has a definition in apt_repos
        run: |
          set -e
          repo_ids=$(jq -r '.tools[].linux.repo // empty' manifest.json | tr -d '' | sort -u)
          defined=$(jq -r '.apt_repos[].id' manifest.json | tr -d '' | sort -u)
          missing=0
          for r in $repo_ids; do
            grep -qx "$r" <<<"$defined" || { echo "::error file=manifest.json::repo '$r' referenced but not in apt_repos"; missing=1; }
          done
          exit $missing

  bash:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n install.sh
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          severity: warning
          additional_files: install.sh

  powershell:
    name: install.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parser
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errs)
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object {
              Write-Host "::error file=install.ps1,line=$($_.Extent.StartLineNumber),col=$($_.Extent.StartColumnNumber)::$($_.Message)"
            }
            exit 1
          }
          Write-Host "install.ps1: parse ok"
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path .\install.ps1 -Severity Warning,Error
          if ($issues) {
            $issues | Format-Table -AutoSize
            $errs = $issues | Where-Object Severity -eq 'Error'
            if ($errs) { exit 1 }
          } else {
            Write-Host "install.ps1: PSScriptAnalyzer clean"
          }
